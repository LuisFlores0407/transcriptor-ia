<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite de Transcripción y Análisis IA</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f0f2f5; }
        .caja { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 90%; width: 500px; }
        input, select, button { margin: 12px 0; padding: 12px; width: 100%; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        input:disabled { background-color: #e9ecef; cursor: not-allowed; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; padding: 15px; transition: background 0.3s; }
        button:hover { background-color: #218838; }
        .nota { font-size: 13px; color: #666; text-align: left; margin-top: -5px; margin-bottom: 15px; display: block;}
        .divisor { font-weight: bold; color: #777; margin: 10px 0; }
        
        #pantalla-carga { display: none; text-align: center; margin-top: 20px; }
        .contenedor-barra { width: 100%; background-color: #e0e0e0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .barra-progreso { height: 20px; width: 0%; background-color: #28a745; transition: width 0.5s ease; }
        .texto-carga { font-weight: bold; color: #333; margin-bottom: 5px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="caja">
        <h2>Transcriptor y Analista IA</h2>
        
        <form id="formulario" enctype="multipart/form-data">
            
            <input type="file" id="input-archivo" name="archivo_subido" accept="audio/*,video/*">
            <span class="nota">*Sube un archivo de Audio o Video local.</span>
            
            <div class="divisor">--- O PEGÁ UN ENLACE ---</div>
            
            <input type="url" id="input-enlace" name="enlace" placeholder="Enlace de YouTube o Google Drive...">
            <span class="nota">*Pegar un enlace desactiva la subida de archivo.</span>
            
            <div class="divisor">--- CONFIGURACIÓN ---</div>
            
            <select name="tipo">
                <option value="rapida">⚡ Modo Rápido (Texto corrido sin minutos)</option>
                <option value="voces">🗣️ Modo Avanzado (Separar voces + Minutos)</option>
                <option value="profesional">👔 Modo Profesional (Lenguaje Formal + Voces + Minutos)</option>
                <option value="resumen">📊 Modo Resumen (Puntos clave y estructurado)</option>
                <option value="traduccion">🌍 Traductor Universal (Traducir a Esp Latino + Voces)</option>
            </select>

            <select name="formato" id="formato-descarga">
                <option value="docx">📄 Descargar como Word (.docx)</option>
                <option value="pdf">📕 Descargar como PDF (.pdf)</option>
            </select>

            <button type="submit" id="btn-submit">Iniciar Procesamiento</button>
        </form>

        <div id="pantalla-carga">
            <div class="texto-carga" id="texto-estado">Iniciando...</div>
            <div class="contenedor-barra">
                <div class="barra-progreso" id="barra"></div>
            </div>
            <p class="nota" style="text-align: center; margin-top: 15px;">La IA está trabajando en segundo plano.<br>La descarga comenzará sola al llegar al 100%.</p>
        </div>
    </div>

    <script>
        const inputArchivo = document.getElementById('input-archivo');
        const inputEnlace = document.getElementById('input-enlace');
        const formulario = document.getElementById('formulario');
        const pantallaCarga = document.getElementById('pantalla-carga');
        const textoEstado = document.getElementById('texto-estado');
        const barra = document.getElementById('barra');

        inputArchivo.addEventListener('change', function() {
            if (this.value) { inputEnlace.disabled = true; inputEnlace.value = ''; } 
            else { inputEnlace.disabled = false; }
        });

        inputEnlace.addEventListener('input', function() {
            if (this.value.trim() !== '') { inputArchivo.disabled = true; inputArchivo.value = ''; } 
            else { inputArchivo.disabled = false; }
        });

        function restaurarPantalla() {
            formulario.style.display = 'block';
            pantallaCarga.style.display = 'none';
            barra.style.width = '0%';
            textoEstado.innerText = 'Iniciando...';
        }

        formulario.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!inputArchivo.value && !inputEnlace.value.trim()) {
                alert("Sube un archivo o pega un enlace.");
                return;
            }

            formulario.style.display = 'none';
            pantallaCarga.style.display = 'block';
            barra.style.width = '5%';
            textoEstado.innerText = 'Subiendo información...';
            
            let formData = new FormData(formulario);
            
            try {
                let resInit = await fetch('/iniciar_transcripcion', { method: 'POST', body: formData });
                let dataInit = await resInit.json();
                
                if (dataInit.error) {
                    alert(dataInit.error);
                    restaurarPantalla();
                    return;
                }
                
                let taskId = dataInit.task_id;
                
                let intervalo = setInterval(async function() {
                    try {
                        let resEst = await fetch('/estado/' + taskId);
                        let dataEst = await resEst.json();
                        
                        if (dataEst.error) {
                            clearInterval(intervalo);
                            alert("Error: " + dataEst.error);
                            restaurarPantalla();
                            return;
                        }
                        
                        barra.style.width = dataEst.progreso + '%';
                        textoEstado.innerText = dataEst.estado;
                        
                        if (dataEst.progreso === 100) {
                            clearInterval(intervalo);
                            window.location.href = '/descargar/' + taskId; 
                            setTimeout(restaurarPantalla, 4000);
                        } else if (dataEst.progreso === -1) {
                            clearInterval(intervalo);
                            alert("Fallo el proceso: " + dataEst.estado);
                            restaurarPantalla();
                        }
                    } catch(err) {
                        console.log("Esperando servidor...");
                    }
                }, 2000);

            } catch (error) {
                alert("Error de red al iniciar.");
                restaurarPantalla();
            }
        });
    </script>
</body>
</html>
