<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriptor de Audio a Word</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; margin-top: 50px; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 20px; font-weight: bold;}
        button:hover { background-color: #0056b3; }
        input[type="file"] { margin-top: 20px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Transcriptor de Audio 🎙️</h1>
        <p>Sube tu nota de voz o archivo MP3 y obtén un Word al instante.</p>
        
        <form action="/transcribe" method="post" enctype="multipart/form-data">
            <input type="file" name="audio_file" accept="audio/*" required>
            <br>
            <button type="submit">Transcribir y descargar Word</button>
        </form>
    </div>
</body>
</html>
